<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العمر - ميلادي وهجري</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator-card">
            <h1>🎂 حاسبة العمر</h1>
            <p class="subtitle">احسب عمرك بالميلادي والهجري بدقة</p>
            
            <div class="form-group">
                <label for="calendarType">نوع التاريخ:</label>
                <select id="calendarType">
                    <option value="gregorian">ميلادي</option>
                    <option value="hijri">هجري</option>
                </select>
            </div>

            <div class="form-group">
                <label for="birthDate">تاريخ الميلاد:</label>
                <input type="date" id="birthDate" required>
            </div>

            <button onclick="calculateAge()">احسب العمر 🕒</button>

            <div id="result" class="result-container" style="display: none;">
                <div class="result-card">
                    <div class="age-main">
                        <span id="ageYears">0</span> سنة
                    </div>
                    <div class="age-details">
                        <div class="detail-item">
                            <span id="ageDays">0</span>
                            <small>يوم</small>
                        </div>
                        <div class="detail-item">
                            <span id="ageHours">0</span>
                            <small>ساعة</small>
                        </div>
                        <div class="detail-item">
                            <span id="ageMinutes">0</span>
                            <small>دقيقة</small>
                        </div>
                    </div>
                    <div class="next-birthday">
                        <p>🎈 عيد ميلادك القادم:</p>
                        <span id="nextBirthday">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
