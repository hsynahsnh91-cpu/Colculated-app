<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العمر - ميلادي وهجري</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 id="sidebarTitle">📱 التطبيقات</h2>
            <button class="close-sidebar" id="closeSidebar">✕</button>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-btn active" data-app="age-calculator">
                <span class="icon">🎂</span>
                <span class="text" data-lang-ar="حساب العمر" data-lang-en="Age Calculator">حساب العمر</span>
            </button>
            <button class="nav-btn" data-app="calculator">
                <span class="icon">🧮</span>
                <span class="text" data-lang-ar="الآلة الحاسبة" data-lang-en="Simple Calculator">الآلة الحاسبة</span>
            </button>
        </nav>
        <div class="sidebar-footer">
            <p>&copy; 2026 <strong>أبوعمر</strong><br>جميع الحقوق محفوظة</p>
        </div>
    </div>

    <!-- غطاء القائمة الجانبية -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- الشريط العلوي الثابت -->
    <header class="header">
        <button class="menu-btn" id="menuBtn" aria-label="فتح القائمة">☰</button>
        <h1 class="app-title">حاسبتك الذكية</h1>
        <div class="header-controls">
            <button class="language-toggle" id="languageToggle" aria-label="تبديل اللغة">
                <span class="language-icon">🌍</span>
            </button>
            <button class="notification-btn" id="notificationToggleBtn" aria-label="الإشعارات">
                🔔 <span class="notification-badge" id="notificationStatus">OFF</span>
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <!-- تطبيق حساب العمر -->
        <div class="app-section active" id="age-calculator-app">
            <div class="container">
                <div class="calculator-card">
                    <h2 id="pageTitle">🎂 حاسبة العمر</h2>
                    <p class="subtitle" id="pageSubtitle">احسب عمرك بالميلادي والهجري بدقة</p>
                    
                    <div class="form-group">
                        <label for="calendarType" id="calendarLabel">نوع التاريخ:</label>
                        <select id="calendarType" class="form-control">
                            <option value="gregorian" id="gregorianOption">ميلادي</option>
                            <option value="hijri" id="hijriOption">هجري</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="birthDate" id="birthDateLabel">تاريخ الميلاد:</label>
                        <input type="date" id="birthDate" class="form-control" required>
                    </div>

                    <button class="btn-primary" id="calculateButton" onclick="calculateAge()">احسب العمر 🕒</button>

                    <div id="result" class="result-container" style="display: none;">
                        <div class="result-card">
                            <div class="age-main">
                                <span id="ageYears">0</span> <span id="yearText">سنة</span>
                            </div>
                            <div class="age-details">
                                <div class="detail-item">
                                    <span id="ageDays">0</span>
                                    <small id="dayText">يوم</small>
                                </div>
                                <div class="detail-item">
                                    <span id="ageHours">0</span>
                                    <small id="hourText">ساعة</small>
                                </div>
                                <div class="detail-item">
                                    <span id="ageMinutes">0</span>
                                    <small id="minuteText">دقيقة</small>
                                </div>
                            </div>
                            <div class="next-birthday">
                                <p id="nextBirthdayLabel">🎈 عيد ميلادك القادم:</p>
                                <span id="nextBirthday">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- تطبيق الآلة الحاسبة -->
        <div class="app-section" id="calculator-app" style="display: none;">
            <div class="container">
                <div class="calculator-card">
                    <h2>🧮 الآلة الحاسبة</h2>
                    <p class="subtitle">احسب العمليات الحسابية بسهولة</p>
                    
                    <div class="calc-display" id="calcDisplay">0</div>
                    
                    <div class="calc-buttons">
                        <button class="calc-btn calc-clear" onclick="clearCalc()">C</button>
                        <button class="calc-btn calc-operator" onclick="appendCalc('/')">/</button>
                        <button class="calc-btn calc-operator" onclick="appendCalc('*')">×</button>
                        <button class="calc-btn calc-delete" onclick="deleteCalc()">←</button>
                        
                        <button class="calc-btn" onclick="appendCalc('7')">7</button>
                        <button class="calc-btn" onclick="appendCalc('8')">8</button>
                        <button class="calc-btn" onclick="appendCalc('9')">9</button>
                        <button class="calc-btn calc-operator" onclick="appendCalc('-')">−</button>
                        
                        <button class="calc-btn" onclick="appendCalc('4')">4</button>
                        <button class="calc-btn" onclick="appendCalc('5')">5</button>
                        <button class="calc-btn" onclick="appendCalc('6')">6</button>
                        <button class="calc-btn calc-operator" onclick="appendCalc('+')">+</button>
                        
                        <button class="calc-btn" onclick="appendCalc('1')">1</button>
                        <button class="calc-btn" onclick="appendCalc('2')">2</button>
                        <button class="calc-btn" onclick="appendCalc('3')">3</button>
                        <button class="calc-btn calc-equal" onclick="calculateCalc()">=</button>
                        
                        <button class="calc-btn calc-zero" onclick="appendCalc('0')">0</button>
                        <button class="calc-btn" onclick="appendCalc('.')">.</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- التذييل الثابت -->
    <footer class="footer">
        <p>&copy; 2026 <strong>أبوعمر</strong> | جميع الحقوق محفوظة</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
